version: '3.8'

services:
  # PHP Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-pos-app
    container_name: laravel-pos-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - laravel-pos-network
    depends_on:
      - db
      - redis

  # Nginx Service
  webserver:
    image: nginx:alpine
    container_name: laravel-pos-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - laravel-pos-network
    depends_on:
      - app

  # PostgreSQL Database Service
  db:
    image: postgres:15
    container_name: laravel-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: laravel_pos
      POSTGRES_USER: laravel_user
      POSTGRES_PASSWORD: user_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - laravel-pos-network

  # Redis Service
  redis:
    image: redis:alpine
    container_name: laravel-pos-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - laravel-pos-network

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-pos-queue
    restart: unless-stopped
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    volumes:
      - ./:/var/www
    networks:
      - laravel-pos-network
    depends_on:
      - db
      - redis

  # Scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-pos-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
    networks:
      - laravel-pos-network
    depends_on:
      - db
      - redis

# Docker Networks
networks:
  laravel-pos-network:
    driver: bridge

# Volumes
volumes:
  dbdata:
    driver: local